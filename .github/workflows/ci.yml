name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write
  security-events: write    # codeql / trivy SARIF upload

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Backend: restore -> lint -> build -> test
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (.NET 9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with: { dotnet-version: '9.0.x' }

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('backend/**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        working-directory: backend
        run: dotnet restore Pawzaroo.sln

      - name: Lint (dotnet format)
        working-directory: backend
        run: dotnet format Pawzaroo.sln --verify-no-changes --no-restore --verbosity diagnostic
        continue-on-error: true     # advisory until the team enables strict mode

      - name: Build
        working-directory: backend
        run: dotnet build Pawzaroo.sln -c Release --no-restore

      - name: Build with analyzers as errors (CI strict)
        working-directory: backend
        env: { CI: 'true' }
        run: dotnet build Pawzaroo.sln -c Release --no-incremental -warnaserror -p:StrictWarnings=true
        continue-on-error: true     # advisory until the existing warning backlog is cleared; then remove this line

      - name: Test
        working-directory: backend
        run: dotnet test Pawzaroo.sln -c Release --no-build --logger trx --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/TestResults

  # ---------------------------------------------------------------------------
  # Frontend: install -> lint -> typecheck -> build
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Lint
        working-directory: frontend
        run: npm run lint --if-present

      - name: Typecheck + build
        working-directory: frontend
        run: npm run build

      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: frontend/dist

  # ---------------------------------------------------------------------------
  # Security scans — advisory unless the team flips the gates.
  # ---------------------------------------------------------------------------
  security:
    name: Security scans
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} }

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '0'          # advisory; flip to '1' to enforce
          format: sarif
          output: trivy.sarif

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with: { sarif_file: trivy.sarif }

      - name: CodeQL init
        uses: github/codeql-action/init@v3
        with: { languages: csharp,javascript }
      - name: CodeQL build
        run: cd backend && dotnet build Pawzaroo.sln -c Release
      - name: CodeQL analyze
        uses: github/codeql-action/analyze@v3

  # ---------------------------------------------------------------------------
  # Frontend unit/component tests (vitest). Separate from the build job above.
  # ---------------------------------------------------------------------------
  frontend-tests:
    name: Frontend tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Vitest
        working-directory: frontend
        run: npx vitest run

  # ---------------------------------------------------------------------------
  # Kubernetes manifests: render every overlay and validate against the API schemas.
  # ---------------------------------------------------------------------------
  k8s-manifests:
    name: K8s manifests (kustomize + kubeconform)
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: v0.6.7
    steps:
      - uses: actions/checkout@v4
      - uses: imranismail/setup-kustomize@v2
      - name: Install kubeconform (pinned release)
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar xz kubeconform
          sudo mv kubeconform /usr/local/bin/
          kubeconform -v
      - name: Validate base + overlays
        run: |
          set -euo pipefail
          for dir in deploy/k8s/base deploy/k8s/overlays/dev deploy/k8s/overlays/staging deploy/k8s/overlays/production; do
            echo "::group::$dir"
            kustomize build "$dir" | kubeconform -strict -summary -ignore-missing-schemas \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
            echo "::endgroup::"
          done
      - name: kube-linter (advisory)
        continue-on-error: true
        run: |
          curl -fsSL https://github.com/stackrox/kube-linter/releases/download/v0.7.1/kube-linter-linux.tar.gz | tar xz
          for dir in deploy/k8s/overlays/dev deploy/k8s/overlays/production; do
            kustomize build "$dir" > "/tmp/$(basename "$dir").yaml"
            ./kube-linter lint "/tmp/$(basename "$dir").yaml"
          done

  # ---------------------------------------------------------------------------
  # Docker Compose smoke test: boot the stack, wait for health, hit a few endpoints.
  # ---------------------------------------------------------------------------
  compose-smoke:
    name: Compose smoke
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: docker compose -f deploy/docker-compose.yml up -d --build postgres redis kafka kafka-init minio minio-init api
      - name: Migrate-only (guarded until the CLI mode is merged everywhere)
        continue-on-error: true
        run: |
          # `dotnet Pawzaroo.Api.dll --migrate-only` runs migrations as a one-shot and exits.
          docker compose -f deploy/docker-compose.yml run --rm --no-deps api dotnet Pawzaroo.Api.dll --migrate-only
      - name: Wait for /health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health >/dev/null; then echo "healthy after ${i} tries"; exit 0; fi
            sleep 5
          done
          docker compose -f deploy/docker-compose.yml logs --tail=200 api
          exit 1
      - name: Smoke requests
        run: |
          set -e
          curl -fsS http://localhost:8080/health/ready || echo "readiness not green (dependencies still starting)"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/vets); echo "GET /api/v1/vets -> $code"
          test "$code" = "200"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/pets); echo "GET /api/v1/pets (anonymous) -> $code"
          test "$code" = "401"
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --tail=300
      - name: Tear down
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v
