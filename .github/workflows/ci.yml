name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write
  security-events: write    # codeql / trivy SARIF upload

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Backend: restore -> lint -> build -> test
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (.NET 9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with: { dotnet-version: '9.0.x' }

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('backend/**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        working-directory: backend
        run: dotnet restore Pawzaroo.sln

      - name: Lint (dotnet format)
        working-directory: backend
        run: dotnet format Pawzaroo.sln --verify-no-changes --no-restore --verbosity diagnostic
        continue-on-error: true     # advisory until the team enables strict mode

      - name: Build
        working-directory: backend
        run: dotnet build Pawzaroo.sln -c Release --no-restore

      - name: Test
        working-directory: backend
        run: dotnet test Pawzaroo.sln -c Release --no-build --logger trx --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/TestResults

  # ---------------------------------------------------------------------------
  # Frontend: install -> lint -> typecheck -> build
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Lint
        working-directory: frontend
        run: npm run lint --if-present

      - name: Typecheck + build
        working-directory: frontend
        run: npm run build

      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: frontend/dist

  # ---------------------------------------------------------------------------
  # Security scans — advisory unless the team flips the gates.
  # ---------------------------------------------------------------------------
  security:
    name: Security scans
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} }

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '0'          # advisory; flip to '1' to enforce
          format: sarif
          output: trivy.sarif

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with: { sarif_file: trivy.sarif }

      - name: CodeQL init
        uses: github/codeql-action/init@v3
        with: { languages: csharp,javascript }
      - name: CodeQL build
        run: cd backend && dotnet build Pawzaroo.sln -c Release
      - name: CodeQL analyze
        uses: github/codeql-action/analyze@v3
