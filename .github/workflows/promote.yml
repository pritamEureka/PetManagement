name: Promote

# One-click promotion of an image tag that is already running in one environment to the next.
# The target GitHub Environment (staging / production) carries the required-reviewer protection rule,
# so the job pauses for approval before touching the cluster.
on:
  workflow_dispatch:
    inputs:
      from_env:
        description: Environment the tag was validated in
        required: true
        type: choice
        options: [dev, staging]
      to_env:
        description: Environment to promote to
        required: true
        type: choice
        options: [staging, production]
      image_tag:
        description: Image tag to promote (e.g. v1.4.2 or sha-abc1234)
        required: true
        type: string

permissions:
  contents: read
  packages: read
  id-token: write

concurrency:
  group: promote-${{ github.event.inputs.to_env }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  validate:
    name: Validate request
    runs-on: ubuntu-latest
    steps:
      - name: Check promotion path
        run: |
          FROM="${{ github.event.inputs.from_env }}"; TO="${{ github.event.inputs.to_env }}"
          case "$FROM->$TO" in
            "dev->staging"|"staging->production") ;;
            *) echo "::error::Unsupported promotion $FROM -> $TO (allowed: dev->staging, staging->production)"; exit 1 ;;
          esac
          if ! [[ "${{ github.event.inputs.image_tag }}" =~ ^[A-Za-z0-9._-]{1,128}$ ]]; then
            echo "::error::image_tag contains unexpected characters"; exit 1
          fi
      - uses: sigstore/cosign-installer@v3.7.0
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify signatures of all three images before promoting
        run: |
          for img in api worker web; do
            cosign verify \
              --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "${{ env.REGISTRY }}/${{ github.repository }}-$img:${{ github.event.inputs.image_tag }}" > /dev/null
            echo "verified $img"
          done

  deploy:
    name: Deploy to ${{ github.event.inputs.to_env }}
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.to_env }}      # approval gate configured in repo Settings -> Environments
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - uses: imranismail/setup-kustomize@v2
      - name: Resolve target
        id: target
        run: |
          case "${{ github.event.inputs.to_env }}" in
            staging)    echo "ns=pawzaroo-staging" >> "$GITHUB_OUTPUT"; echo "kube=KUBECONFIG_STAGING" >> "$GITHUB_OUTPUT" ;;
            production) echo "ns=pawzaroo"         >> "$GITHUB_OUTPUT"; echo "kube=KUBECONFIG_PROD"    >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Configure kubeconfig
        env:
          KUBECONFIG_STAGING: ${{ secrets.KUBECONFIG_STAGING }}
          KUBECONFIG_PROD: ${{ secrets.KUBECONFIG_PROD }}
          KUBE_VAR: ${{ steps.target.outputs.kube }}
        shell: bash
        run: |
          mkdir -p ~/.kube
          printf '%s' "${!KUBE_VAR}" | base64 -d > ~/.kube/config
      - name: Sanity - tag currently deployed in source environment (informational)
        run: echo "Promoting ${{ github.event.inputs.image_tag }} from ${{ github.event.inputs.from_env }} to ${{ github.event.inputs.to_env }}"
      - uses: ./.github/actions/deploy
        with:
          overlay: deploy/k8s/overlays/${{ github.event.inputs.to_env }}
          image_tag: ${{ github.event.inputs.image_tag }}
          namespace: ${{ steps.target.outputs.ns }}
