name: Release

# Triggers:
#   - tag v* -> production release flow (staging then prod, both gated)
#   - push to main -> auto-deploy to dev
#   - manual dispatch -> deploy any sha to any environment
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [dev, staging, production]
        default: dev
      image_tag:
        description: Image tag (defaults to short SHA / git tag)
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Compute one canonical image tag used by every downstream job.
  # ---------------------------------------------------------------------------
  meta:
    name: Resolve tag + target
    runs-on: ubuntu-latest
    outputs:
      image_tag:   ${{ steps.tag.outputs.image_tag }}
      environment: ${{ steps.tag.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        name: Pick tag + environment
        run: |
          set -e
          INPUT_TAG="${{ github.event.inputs.image_tag }}"
          INPUT_ENV="${{ github.event.inputs.environment }}"
          if [[ -n "$INPUT_TAG" ]]; then
            TAG="$INPUT_TAG"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="sha-$(echo $GITHUB_SHA | cut -c1-7)"
          fi
          if [[ -n "$INPUT_ENV" ]]; then
            ENV="$INPUT_ENV"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            ENV="production"
          else
            ENV="dev"
          fi
          echo "image_tag=$TAG" >> $GITHUB_OUTPUT
          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "Resolved: tag=$TAG environment=$ENV"

  # ---------------------------------------------------------------------------
  # Build + push all three images in parallel.
  # ---------------------------------------------------------------------------
  build:
    name: Build & push (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: backend/src/Pawzaroo.Api/Dockerfile
          - image: worker
            dockerfile: backend/src/Pawzaroo.Worker/Dockerfile
          - image: web
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          provenance: true
          sbom: true
          build-args: |
            VERSION=${{ needs.meta.outputs.image_tag }}
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:${{ needs.meta.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to:   type=gha,mode=max,scope=${{ matrix.image }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:${{ needs.meta.outputs.image_tag }}
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true

  # ---------------------------------------------------------------------------
  # Deploy to dev — auto, no approval.
  # ---------------------------------------------------------------------------
  deploy-dev:
    name: Deploy → dev
    if: needs.meta.outputs.environment == 'dev'
    needs: [meta, build]
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: https://dev.pawzaroo.example.com
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - uses: imranismail/setup-kustomize@v2
      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DEV }}" | base64 -d > ~/.kube/config
      - uses: ./.github/actions/deploy
        with:
          overlay: deploy/k8s/overlays/dev
          image_tag: ${{ needs.meta.outputs.image_tag }}
          namespace: pawzaroo-dev

  # ---------------------------------------------------------------------------
  # Staging — gated by the "staging" GitHub Environment (configure reviewers in
  # repo settings → Environments → staging → "Required reviewers").
  # ---------------------------------------------------------------------------
  deploy-staging:
    name: Deploy → staging (approval)
    if: needs.meta.outputs.environment == 'staging' || startsWith(github.ref, 'refs/tags/v')
    needs: [meta, build]
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.pawzaroo.example.com
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - uses: imranismail/setup-kustomize@v2
      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 -d > ~/.kube/config
      - uses: ./.github/actions/deploy
        with:
          overlay: deploy/k8s/overlays/staging
          image_tag: ${{ needs.meta.outputs.image_tag }}
          namespace: pawzaroo-staging

  # ---------------------------------------------------------------------------
  # Production — only on a v* tag, requires manual approval.
  # ---------------------------------------------------------------------------
  deploy-production:
    name: Deploy → production (approval)
    if: startsWith(github.ref, 'refs/tags/v') || needs.meta.outputs.environment == 'production'
    needs: [meta, build, deploy-staging]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://pawzaroo.example.com
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - uses: imranismail/setup-kustomize@v2
      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_PROD }}" | base64 -d > ~/.kube/config
      - uses: ./.github/actions/deploy
        with:
          overlay: deploy/k8s/overlays/production
          image_tag: ${{ needs.meta.outputs.image_tag }}
          namespace: pawzaroo
