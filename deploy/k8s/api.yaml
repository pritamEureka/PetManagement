apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: pawzaroo
spec:
  replicas: 3
  selector: { matchLabels: { app: api } }
  template:
    metadata:
      labels: { app: api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: api
          image: ghcr.io/your-org/pawzaroo-api:latest
          ports: [{ containerPort: 8080 }]
          env:
            - { name: ASPNETCORE_ENVIRONMENT, value: Production }
            - { name: ConnectionStrings__Postgres, value: "Host=postgres;Port=5432;Database=pawzaroo;Username=pawzaroo;Password=$(POSTGRES_PASSWORD)" }
            - { name: ConnectionStrings__Redis, value: "redis:6379" }
            - { name: Kafka__BootstrapServers, value: "kafka:9092" }
            - { name: Storage__Endpoint, valueFrom: { configMapKeyRef: { name: pawzaroo-config, key: STORAGE_ENDPOINT } } }
            - { name: Storage__Bucket,   valueFrom: { configMapKeyRef: { name: pawzaroo-config, key: STORAGE_BUCKET } } }
            - { name: Storage__AccessKey, valueFrom: { secretKeyRef: { name: pawzaroo-secrets, key: STORAGE_ACCESS_KEY } } }
            - { name: Storage__SecretKey, valueFrom: { secretKeyRef: { name: pawzaroo-secrets, key: STORAGE_SECRET_KEY } } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: pawzaroo-secrets, key: POSTGRES_PASSWORD } }
            - name: Jwt__SigningKey
              valueFrom: { secretKeyRef: { name: pawzaroo-secrets, key: JWT_SIGNING_KEY } }
          readinessProbe:
            httpGet: { path: /health/ready, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: "200m", memory: "256Mi" }
            limits:   { cpu: "1",    memory: "1Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: pawzaroo
  labels: { app: api }
spec:
  type: ClusterIP
  selector: { app: api }
  ports: [{ port: 8080, targetPort: 8080, name: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: pawzaroo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  namespace: pawzaroo
spec:
  minAvailable: 2
  selector: { matchLabels: { app: api } }
