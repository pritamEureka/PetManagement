# EXAMPLE ONLY (not in kustomization.yaml): External Secrets Operator mapping to the keys the workloads read
# from Secret/pawzaroo-secrets. Requires ESO CRDs + a (Cluster)SecretStore named "pawzaroo-store".
# When adopting it, REMOVE secret.yaml from kustomization.yaml (ESO owns the Secret; creationPolicy: Owner).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: pawzaroo-secrets
  namespace: pawzaroo
spec:
  refreshInterval: 1h            # picks up rotated values; pods need a restart to re-read env vars (see docs/secret-rotation.md)
  secretStoreRef:
    kind: ClusterSecretStore
    name: pawzaroo-store
  target:
    name: pawzaroo-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - { secretKey: POSTGRES_PASSWORD,   remoteRef: { key: pawzaroo/prod/postgres,   property: password } }
    - { secretKey: JWT_SIGNING_KEY,     remoteRef: { key: pawzaroo/prod/jwt,        property: signing_key } }
    - { secretKey: STORAGE_ACCESS_KEY,  remoteRef: { key: pawzaroo/prod/storage,    property: access_key } }
    - { secretKey: STORAGE_SECRET_KEY,  remoteRef: { key: pawzaroo/prod/storage,    property: secret_key } }
    - { secretKey: REDIS_PASSWORD,      remoteRef: { key: pawzaroo/prod/redis,      property: password } }
    - { secretKey: SUPERADMIN_PASSWORD, remoteRef: { key: pawzaroo/prod/superadmin, property: password } }
