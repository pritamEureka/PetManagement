apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pawzaroo
  namespace: pawzaroo
  labels: { app.kubernetes.io/part-of: pawzaroo }
  annotations:
    # cert-manager picks this up and issues a TLS cert into pawzaroo-tls.
    # Overlays may change to "letsencrypt-staging" for non-prod.
    cert-manager.io/cluster-issuer: "letsencrypt-prod"

    # SignalR / WebSocket support — long timeouts.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"

    # File uploads (avatars, post media). Keep aligned with API multipart limit.
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"

    # Security headers added at the edge.
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "Strict-Transport-Security: max-age=63072000; includeSubDomains";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";

    # Force HTTPS — also covers /api/* and /hubs/*.
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - pawzaroo.example.com
      secretName: pawzaroo-tls
  rules:
    - host: pawzaroo.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: api, port: { number: 8080 } }
          - path: /hubs
            pathType: Prefix
            backend:
              service: { name: api, port: { number: 8080 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: web, port: { number: 80 } }
---
# TLS issuer (placeholder). Replace with your real ACME endpoint or remove if
# you provision certs out-of-band (e.g. AWS ACM behind an ALB).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: devops@pawzaroo.example.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            class: nginx
