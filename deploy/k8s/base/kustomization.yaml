apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Workloads, services, autoscalers, and policies.
# The migration / smoke-test Jobs are NOT part of the base — CI renders them
# with envsubst so a fresh ${IMAGE_TAG} can be injected on each deploy.
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - secret.yaml
  - postgres.yaml
  - redis.yaml
  - kafka.yaml
  - minio.yaml
  - api.deployment.yaml
  - api.service.yaml
  - api.hpa.yaml
  - worker.deployment.yaml
  - web.deployment.yaml
  - ingress.yaml
  - networkpolicy.yaml

# Common labels stamped onto every resource — easy filtering with kubectl.
commonLabels:
  app.kubernetes.io/part-of: pawzaroo

# Pipelines MUST override newTag (e.g. `kustomize edit set image
# ghcr.io/your-org/pawzaroo-api=ghcr.io/your-org/pawzaroo-api:$GIT_SHA`).
# 0.0.0 is intentionally non-pullable so an unconfigured deploy fails fast.
images:
  - name: ghcr.io/your-org/pawzaroo-api
    newTag: "0.0.0"
  - name: ghcr.io/your-org/pawzaroo-worker
    newTag: "0.0.0"
  - name: ghcr.io/your-org/pawzaroo-web
    newTag: "0.0.0"
