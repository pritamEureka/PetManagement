# In-cluster Redis for dev/staging. Production should use a managed cluster
# (Elasticache, Memorystore) and override or omit this manifest.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: pawzaroo
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 5Gi }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: pawzaroo
  labels: { app: redis, app.kubernetes.io/part-of: pawzaroo }
spec:
  serviceName: redis
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      securityContext:
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: redis
          image: redis:7.4-alpine
          # Auth is mandatory in cluster — REDIS_PASSWORD comes from pawzaroo-secrets.
          # The shell wrapper builds the args dynamically so an empty password
          # (dev only) still works.
          command: ["sh", "-c"]
          args:
            - >-
              exec redis-server --appendonly yes --maxmemory 512mb
              --maxmemory-policy allkeys-lru
              ${REDIS_PASSWORD:+--requirepass "$REDIS_PASSWORD"}
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: pawzaroo-secrets, key: REDIS_PASSWORD, optional: true }
          ports:
            - { containerPort: 6379, name: redis }
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli ${REDIS_PASSWORD:+-a "$REDIS_PASSWORD"} ping | grep PONG
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli ${REDIS_PASSWORD:+-a "$REDIS_PASSWORD"} ping | grep PONG
            periodSeconds: 15
          resources:
            requests: { cpu: "50m",  memory: "128Mi" }
            limits:   { cpu: "500m", memory: "768Mi" }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: redis-data }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: pawzaroo
spec:
  selector: { app: redis }
  ports:
    - { name: redis, port: 6379, targetPort: redis }
