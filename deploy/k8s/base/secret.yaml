# ----------------------------------------------------------------------------
#  TEMPLATE ONLY — never commit real secrets.
#
#  Recommended workflows:
#    1. External Secrets Operator: point at AWS Secrets Manager / Vault / GSM
#    2. Sealed Secrets (Bitnami): commit the encrypted SealedSecret; controller
#       decrypts in-cluster.
#    3. CI injection: render this manifest with `envsubst` and `kubectl apply`,
#       pulling values from the runner's secret store.
#
#  The values below are placeholders so `kustomize build` succeeds locally —
#  *replace before applying to any real cluster*.
# ----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: pawzaroo-secrets
  namespace: pawzaroo
  labels: { app.kubernetes.io/part-of: pawzaroo }
type: Opaque
stringData:
  POSTGRES_PASSWORD:  "REPLACE_ME"
  JWT_SIGNING_KEY:    "REPLACE_ME_WITH_LONG_RANDOM_AT_LEAST_32_CHARS"
  STORAGE_ACCESS_KEY: "REPLACE_ME"
  STORAGE_SECRET_KEY: "REPLACE_ME"
  REDIS_PASSWORD:     ""
