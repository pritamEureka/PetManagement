# ----------------------------------------------------------------------------
#  TEMPLATE ONLY — DO NOT APPLY AS-IS.
#
#  Real values MUST come from a secrets backend, not from this YAML. Pick one:
#    1. External Secrets Operator -> AWS Secrets Manager / Vault / GSM
#    2. Sealed Secrets (Bitnami) — commit the encrypted SealedSecret instead
#    3. CI envsubst from the runner's secret store, then `kubectl apply`
#
#  All values below are deliberately EMPTY so `kustomize build` succeeds
#  locally but `kubectl apply` will fail readiness checks (the API does
#  startup validation that rejects empty / placeholder secrets — see
#  StartupSecretValidator.cs). That fail-fast is the whole point: a
#  cluster will NOT come up with placeholder secrets.
# ----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: pawzaroo-secrets
  namespace: pawzaroo
  labels: { app.kubernetes.io/part-of: pawzaroo }
  annotations:
    pawzaroo.dev/warning: "Empty placeholder. Populate via secrets manager before deploy."
type: Opaque
stringData:
  POSTGRES_PASSWORD:  ""
  JWT_SIGNING_KEY:    ""
  STORAGE_ACCESS_KEY: ""
  STORAGE_SECRET_KEY: ""
  REDIS_PASSWORD:     ""
  # Optional: when non-empty the API seeds a SuperAdmin account on first boot.
  SUPERADMIN_PASSWORD: ""
