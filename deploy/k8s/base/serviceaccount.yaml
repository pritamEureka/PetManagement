apiVersion: v1
kind: ServiceAccount
metadata:
  name: pawzaroo
  namespace: pawzaroo
  labels: { app.kubernetes.io/part-of: pawzaroo }
# No automount needed unless a pod talks to the K8s API.
automountServiceAccountToken: false
---
# Default-deny baseline: only same-namespace pods + ingress controller can talk
# to our pods. Overlays may relax for monitoring / external traffic.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: pawzaroo
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-in-namespace
  namespace: pawzaroo
spec:
  podSelector: {}
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
  policyTypes: [Ingress]
