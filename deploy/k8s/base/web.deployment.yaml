apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: pawzaroo
  labels:
    app: web
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: pawzaroo
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 25% }
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web, app.kubernetes.io/name: web }
    spec:
      serviceAccountName: pawzaroo
      securityContext:
        runAsNonRoot: true
        runAsUser: 101              # nginx-unprivileged
        fsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          # Image tag MUST be pinned by the deployment pipeline. See api.deployment.yaml.
          image: ghcr.io/your-org/pawzaroo-web:0.0.0
          imagePullPolicy: Always
          ports:
            - { containerPort: 8080, name: http }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          # nginx needs writable /var/cache + /var/run + tmp.
          volumeMounts:
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: run,   mountPath: /var/run }
            - { name: tmp,   mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: "50m",  memory: "64Mi" }
            limits:   { cpu: "500m", memory: "256Mi" }
      volumes:
        - { name: cache, emptyDir: {} }
        - { name: run,   emptyDir: {} }
        - { name: tmp,   emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: pawzaroo
  labels: { app: web, app.kubernetes.io/part-of: pawzaroo }
spec:
  type: ClusterIP
  selector: { app: web }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web
  namespace: pawzaroo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
