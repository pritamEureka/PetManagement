apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pawzaroo-dev
namePrefix: ""
commonLabels:
  app.kubernetes.io/environment: dev

resources:
  - ../../base

patches:
  - path: patches/replicas.yaml
  - path: patches/ingress-host.yaml
  - path: patches/configmap.yaml

# Dev points at non-prod tags rebuilt on every PR.
images:
  - name: ghcr.io/your-org/pawzaroo-api
    newTag: dev
  - name: ghcr.io/your-org/pawzaroo-worker
    newTag: dev
  - name: ghcr.io/your-org/pawzaroo-web
    newTag: dev
