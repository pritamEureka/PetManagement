apiVersion: apps/v1
kind: Deployment
metadata: { name: api, namespace: pawzaroo }
spec: { replicas: 1 }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: worker, namespace: pawzaroo }
spec: { replicas: 1 }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: web, namespace: pawzaroo }
spec: { replicas: 1 }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: api, namespace: pawzaroo }
spec: { minReplicas: 1, maxReplicas: 3 }
