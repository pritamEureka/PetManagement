apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pawzaroo
  namespace: pawzaroo
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts: [pawzaroo.example.com, www.pawzaroo.example.com]
      secretName: pawzaroo-tls
  rules:
    - host: pawzaroo.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: api, port: { number: 8080 } } }
          - path: /hubs
            pathType: Prefix
            backend: { service: { name: api, port: { number: 8080 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: web, port: { number: 80 } } }
    - host: www.pawzaroo.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: web, port: { number: 80 } } }
