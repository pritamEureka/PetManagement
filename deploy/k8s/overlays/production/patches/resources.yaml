apiVersion: apps/v1
kind: Deployment
metadata: { name: api, namespace: pawzaroo }
spec:
  template:
    spec:
      containers:
        - name: api
          resources:
            requests: { cpu: "500m", memory: "512Mi" }
            limits:   { cpu: "2",    memory: "2Gi" }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: worker, namespace: pawzaroo }
spec:
  template:
    spec:
      containers:
        - name: worker
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits:   { cpu: "1",    memory: "1Gi" }
