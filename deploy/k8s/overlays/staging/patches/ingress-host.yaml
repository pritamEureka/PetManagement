apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pawzaroo
  namespace: pawzaroo
spec:
  tls:
    - hosts: [staging.pawzaroo.example.com]
      secretName: pawzaroo-tls
  rules:
    - host: staging.pawzaroo.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: api, port: { number: 8080 } } }
          - path: /hubs
            pathType: Prefix
            backend: { service: { name: api, port: { number: 8080 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: web, port: { number: 80 } } }
