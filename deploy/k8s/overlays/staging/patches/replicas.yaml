apiVersion: apps/v1
kind: Deployment
metadata: { name: api, namespace: pawzaroo }
spec: { replicas: 2 }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: worker, namespace: pawzaroo }
spec: { replicas: 2 }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: web, namespace: pawzaroo }
spec: { replicas: 2 }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: api, namespace: pawzaroo }
spec: { minReplicas: 2, maxReplicas: 6 }
