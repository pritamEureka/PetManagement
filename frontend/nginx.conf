# Nginx config for the static React bundle. Runs inside nginx-unprivileged
# (uid 101), so we listen on 8080 — port 80 needs root.
server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers — keep tight in production; relax for dev as needed.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=()" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Content Security Policy — first-line defense against XSS.
    #  - default-src 'self' so foreign scripts/styles/iframes are blocked.
    #  - img-src allows data: (inline previews) and https: (signed media URLs).
    #  - connect-src 'self' is enough because the SPA talks to /api and /hubs
    #    on the same origin via this proxy. If a CDN or third-party endpoint is
    #    added, append it here rather than relaxing to *.
    #  - frame-ancestors 'none' blocks clickjacking (belt + braces with XFO).
    #  - 'unsafe-inline' on style-src is the one concession — Vite ships inline
    #    style attributes from runtime CSS. Scripts stay strict.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # gzip — Vite already pre-compresses, this catches anything that slipped through.
    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript application/xml image/svg+xml;

    # Long cache for the immutable Vite asset bundle.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SignalR / WebSockets — long read timeout + upgrade headers.
    location /hubs/ {
        proxy_pass http://api:8080/hubs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1d;
    }

    # SPA fallback — index.html for unmatched routes, never cache it.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri /index.html;
    }
}
