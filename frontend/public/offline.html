<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#7c3aed" />
<title>Offline - Pawzaroo</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;background:#faf5ff;color:#1f1535;text-align:center;padding:24px}
  main{max-width:360px}
  img{width:88px;height:88px}
  button{margin-top:16px;padding:10px 20px;border:0;border-radius:8px;background:#7c3aed;color:#fff;font-size:15px;cursor:pointer}
</style>
</head>
<body>
<main>
  <img src="/icons/icon.svg" alt="" />
  <h1>You're offline</h1>
  <p>Pawzaroo can't reach the network right now. Pages you've already opened may still be available; otherwise try again once you're back online.</p>
  <button onclick="location.reload()">Retry</button>
</main>
</body>
</html>
